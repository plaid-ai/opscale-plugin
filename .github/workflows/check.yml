name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check plugin versions
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/check_versions.py --base "origin/${{ github.base_ref }}"
          else
            python3 scripts/check_versions.py
          fi
